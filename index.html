<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>골라잘(Golajar) 시니어 공감 쇼츠 12선 & 20대 카테고리 완전체 스튜디오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .card-hover {
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.08);
      border-color: #6366F1;
    }
    .card-hover:active { transform: scale(0.985); }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop { animation: popIn 0.22s ease-out forwards; }
  </style>
</head>
<body class="pb-24 md:pb-12">

  <!-- 상단 네비게이션 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="resetFilters()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white font-black text-xl shadow-md">
          골
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="font-extrabold text-base sm:text-lg tracking-tight text-slate-900">골라잘 쇼츠 스튜디오</h1>
            <span class="px-2 py-0.5 text-[11px] font-bold bg-indigo-50 text-indigo-700 rounded-full border border-indigo-200">12선 + 20카테고리 완전체</span>
          </div>
          <p class="text-xs text-slate-500 hidden sm:block">제품 강요 ZERO · 공감 5단계 공식 · 원터치 AI 대본/그림 프롬프트 생성기</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="openFormulaModal()" class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 flex items-center gap-1.5 transition">
          <span>📐</span><span class="hidden sm:inline">5단계 공식</span>
        </button>
        <button onclick="openGeneratorModal()" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm flex items-center gap-1.5 transition">
          <span>✨</span><span>카테고리별 예시/새 소재</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 pt-5 space-y-6">

    <!-- 초보자 원터치 3-STEP 안내 & 요약 대시보드 -->
    <section class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-2xl p-4 sm:p-5 text-white shadow-lg">
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        <div class="space-y-1.5">
          <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-white/10 text-amber-300 text-xs font-bold">
            <span>🔥 핵심 전략: 캐릭터가 주인공, 제품은 조연!</span>
          </div>
          <h2 class="text-lg sm:text-xl font-extrabold tracking-tight">아이콘만 터치하면 20초 공감 대본 & AI 그림 명령어가 즉시 완성됩니다</h2>
          <p class="text-xs sm:text-sm text-slate-300">기본 <strong>베스트 12선 시나리오</strong>와 <strong>20대 시니어 인기 쇼핑 카테고리별 즉시 실행 예시</strong>가 모두 탑재되어 있습니다.</p>
        </div>

        <div class="grid grid-cols-3 gap-2 sm:gap-3 shrink-0">
          <button onclick="openGeneratorModal()" class="bg-white/10 hover:bg-white/20 border border-white/15 rounded-xl p-2.5 text-left transition">
            <div class="text-base sm:text-lg mb-0.5">1️⃣ 터치</div>
            <div class="text-[11px] sm:text-xs font-semibold text-indigo-200">20개 카테고리 선택</div>
          </button>
          <button onclick="openDetailModal(1)" class="bg-white/10 hover:bg-white/20 border border-white/15 rounded-xl p-2.5 text-left transition">
            <div class="text-base sm:text-lg mb-0.5">2️⃣ 확인</div>
            <div class="text-[11px] sm:text-xs font-semibold text-amber-200">20초 5단계 대본</div>
          </button>
          <button onclick="copyQuickPrompt()" class="bg-white/10 hover:bg-white/20 border border-white/15 rounded-xl p-2.5 text-left transition">
            <div class="text-base sm:text-lg mb-0.5">3️⃣ 복사</div>
            <div class="text-[11px] sm:text-xs font-semibold text-emerald-200">AI 그림 명령어 복사</div>
          </button>
        </div>
      </div>
    </section>

    <!-- 20대 시니어 인기 쇼핑 카테고리 원터치 바 -->
    <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-base">🛍️</span>
          <h3 class="font-extrabold text-sm sm:text-base text-slate-800">시니어 인기 카테고리 TOP 20 (터치하면 해당 카테고리 예시 대본 즉시 생성)</h3>
        </div>
        <button onclick="openGeneratorModal()" class="text-xs font-bold text-indigo-600 hover:underline shrink-0">전체 20개 펼치기 →</button>
      </div>
      <div id="quickCategoryBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
        <!-- JS로 20개 카테고리 칩 렌더링 -->
      </div>
    </section>

    <!-- 필터 & 검색 컨트롤 -->
    <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-slate-900 text-white shadow-sm shrink-0">
          전체 소재 (<span id="count-all">12</span>)
        </button>
        <button onclick="setFilter('top3')" id="filter-top3" class="filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 shrink-0">
          🏆 우선 제작 TOP 3
        </button>
        <button onclick="setFilter('custom')" id="filter-custom" class="filter-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 shrink-0">
          ✨ 내가 생성한 대본 (<span id="count-custom">0</span>)
        </button>
      </div>

      <div class="relative w-full sm:w-72">
        <input type="text" id="searchInput" oninput="renderCards()" placeholder="키워드 검색 (예: 메두사,
